[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "stage-ott-agent"
version = "0.2.0"
description = "Evidence-driven per-viewer OTT lifecycle agent with replay and OpenAI providers"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.162.0",
  "openai==2.16.0",
  "pydantic==2.12.5",
  "python-dotenv==1.2.1",
  "tiktoken==0.12.0",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.3"]

[project.scripts]
ott-agent = "ott_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ott_agent = ["static/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
